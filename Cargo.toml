[workspace]
resolver = "2"
members = ["projects/crates/smt-model", "projects/crates/smt-napi"]
default-members = ["projects/crates/smt-model", "projects/crates/smt-napi"]
exclude = [
    "projects/.DS_Store",
    "projects/crates/",
    "projects/packages",
    "projects/sites",
]

[workspace.package]
version = "0.0.5"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared host facade for the Node-API surface. The git dependency pins the full
# 40-character revision so local builds and CI resolve the same commit. The
# WebView feature is not needed here and would pull platform system libraries.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "f92f818fde7174154d77a87b55a5e44b367034c9", default-features = false }

[profile.release]
lto = true
panic = "abort"
